    - generic [ref=e13]: The Engineering Ethics Dilemma of the Aktobe ReservoirDuring the 2024 Floods
    - generic [ref=e14]: Rassul Zeinulla · Batyrkhan Zharov | Nazarbayev University · Engineering Ethics
    - generic [ref=e15]:
      - generic [ref=e16]: THE QUESTION
      - generic [ref=e17]: When floodwater arrives faster than a dam can pass it, engineers must choose who bears the risk — the structure, or the people living below it.
    - generic [ref=e18]: "01"
    - generic [ref=e19]: What the engineers were facing
    - generic [ref=e21]: The engineers were not prepared. The danger was never forecast.
    - generic [ref=e22]: Snow was not the problem. In spring 2024 the snow in the reservoir's catchment held 97 % of the normal water. In 2023 it held 130 % — and nothing happened. On 4 March Kazhydromet even reported 16–68 % less snow water than normal in the Ilek basin.
    - generic [ref=e23]:
      - text: So the problem was not
      - emphasis [ref=e24]: how much
      - text: water came.
    - generic [ref=e25]:
      - text: It was
      - emphasis [ref=e26]: how fast
      - text: it came.
    - generic [ref=e27]: Kazhydromet, spring forecast 04.03.2024 and annual snow bulletin 2024
    - generic [ref=e28]: FIVE CAUSES THAT CAME TOGETHER
    - generic [ref=e29]:
      - generic [ref=e30]: "1"
      - generic [ref=e31]: Sudden thaw, 24 March
      - generic [ref=e32]: The weather turned warm very fast. The snow did not melt slowly over weeks — it melted almost at once.
      - generic [ref=e33]: “On 24 March it became warm suddenly and the snow began to melt.” — akim of Kobda district
    - generic [ref=e34]:
      - generic [ref=e35]: "2"
      - generic [ref=e36]: Frozen ground
      - generic [ref=e37]: The soil went into winter wet, then froze deep. Meltwater could not soak in at all. Almost all of it ran over the surface.
      - generic [ref=e38]: This is what turns a normal snowpack into an extreme inflow.
    - generic [ref=e39]:
      - generic [ref=e40]: "3"
      - generic [ref=e41]: Ice crust, up to 6.6 cm
      - generic [ref=e42]: Kazhydromet recorded an ice crust on the soil on 4 March, including in the Ilek basin.
      - generic [ref=e43]: "The crust works like a plastic sheet: water does not stop, it slides straight into the rivers."
    - generic [ref=e44]:
      - generic [ref=e45]: "4"
      - generic [ref=e46]: Rain on melting snow
      - generic [ref=e47]: Two days of rain fell while the snow was already melting.
      - generic [ref=e48]: "Kazhydromet had described this exact scenario three weeks earlier: fast warming plus heavy March rain can create a snowmelt-and-rain flood."
    - generic [ref=e49]:
      - generic [ref=e50]: "5"
      - generic [ref=e51]: Runoff from the steppe
      - generic [ref=e52]: Water did not stay in the river channels. It moved as a wide front across the open steppe.
      - generic [ref=e53]: “On 26 March meltwater from the steppe began to flood the city.” — akim of Aktobe
