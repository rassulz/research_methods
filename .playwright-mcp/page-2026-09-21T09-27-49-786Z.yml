      - text: They took neither option cleanly. To enable the evacuation of residents downstream, the operator —
      - emphasis [ref=e124]: together with local authorities
      - text: — deliberately stored 15 million m³ above the reservoir's design capacity, accepting extra load on the dam to buy hours. Only then was discharge raised to 1,000 m³/s.
