    - generic [ref=e187]: "05"
    - generic [ref=e188]: What should be done — anywhere, not only here
    - generic [ref=e189]:
      - generic [ref=e190]: 1 · Remove the problem before it arrives
      - generic [ref=e191]: ▪ Empty the reservoirs before the flood season.
      - generic [ref=e192]: ▪ Break the river ice early so it cannot form jams.
      - generic [ref=e193]: ▪ Before 2025 the reservoirs were pre-emptied to free 382 million m³.
    - generic [ref=e194]:
      - generic [ref=e195]: 2 · Keep the structures under control
      - generic [ref=e196]: ▪ Inspect and repair gates, cranes and dams every year — not after a disaster.
      - generic [ref=e197]: ▪ In 2024 the crane needed to open the second gate failed at the worst moment.
      - generic [ref=e198]: ▪ 537 structures in Kazakhstan still need repair; 322 threaten 1.5 million people.
    - generic [ref=e199]:
      - generic [ref=e200]: 3 · Be ready for the emergency
      - generic [ref=e201]: "▪ Plan the evacuation before the water comes: routes, buses, shelters."
      - generic [ref=e202]: ▪ Warn people early and clearly, so the state and the population understand each other.
      - generic [ref=e203]: ▪ A warning works only if people believe it and can act on it.
