    - generic [ref=e85]:
      - generic [ref=e86]: ✗ COSTS — THE PEOPLE BELOW
      - generic [ref=e87]: ▪ The water reaches the houses at once.
      - generic [ref=e88]: ▪ People are still at home — no warning has been given.
      - generic [ref=e89]: ▪ No buses and no shelters are ready yet.
